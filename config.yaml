random_state: 42
test_size: 0.2
target: Recovered
id_column: Country/Region

# columns removed exactly as in the notebook
drop_columns: ["1 week change", "1 week % increase"]
leakage_columns: ["Recovered / 100 Cases", "Deaths / 100 Recovered", "Active"]

numeric_features: [Confirmed, Deaths, New cases, New deaths, New recovered, Deaths / 100 Cases, Confirmed last week]
categorical_features: [WHO Region]

paths:
  raw_data: data/raw/country_wise_latest.csv
  new_data: data/raw/new_countries.csv
  processed_dir: data/processed
  models_dir: models
  artifacts_dir: artifacts
  reports_dir: reports
  deployment_dir: deployment
  logs_dir: logs
  drift_dir: data/monitoring/drift

quality_gate:
  min_r2: 0.70
  max_rmse_vs_baseline: 0.60   # model RMSE must be <= 60% of the "predict the mean" RMSE

drift:
  psi_threshold: 0.2
  max_r2_drop: 0.10

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: covid-recovery-prediction
